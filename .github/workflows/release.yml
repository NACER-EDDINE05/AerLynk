name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: attach the built artifacts to this existing Release tag (e.g. v0.1.1). Leave empty for a plain test build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
          - platform: ubuntu-22.04
            os: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            file \
            patchelf \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JS dependencies
        run: npm ci

      - name: Build (${{ matrix.os }})
        run: npm run tauri build

      - name: Upload build artifacts (Actions artifacts / test builds)
        uses: actions/upload-artifact@v4
        with:
          name: airlynk-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      # Attach the bundles to a GitHub Release. Two ways in:
      #   1. A version tag push (v*) -> tag name decides the release.
      #   2. A manual workflow_dispatch with release_tag set.
      - name: Attach bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" --title "AirLynk $TAG" || true
          fi
          add() {
            local dir="$1" glob="$2"
            if ls "$dir"/$glob >/dev/null 2>&1; then
              gh release upload "$TAG" "$dir"/$glob --clobber
            fi
          }
          add src-tauri/target/release/bundle/nsis "*.exe"
          add src-tauri/target/release/bundle/msi "*.msi"
          add src-tauri/target/release/bundle/deb "*.deb"
          add src-tauri/target/release/bundle/rpm "*.rpm"
          add src-tauri/target/release/bundle/appimage "*.AppImage"
          echo "Attached bundles to release $TAG"